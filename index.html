<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<!-- 这台手机是「浅色 + 自己一套深色壁纸」，不该让浏览器自作主张反色。
     安卓 Chrome 的「自动深色」会整页反相，纸色被翻成深底、头像看着像负片。
     注意：只有 `only light` 能挡住，写 `light` 没用（实测 rgb(33,32,30) vs rgb(250,248,245)）。 -->
<meta name="color-scheme" content="only light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="yphone">
<meta name="description" content="运行在浏览器中的虚拟手机，支持角色卡、AI 对话、世界书与本地应用。">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png?v=ymusic8">
<title>yphone</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=ymusic8">
<!-- 默认那两张照片先拉起来：不然进桌面/锁屏会先闪一下白底再跳出来 -->
<link rel="preload" as="image" href="img/wall-window.webp">
<link rel="preload" as="image" href="img/wall-rain.webp">
</head>
<body>

<!-- 桌面端把手机居中，屏幕小的时候直接铺满 -->
<div id="stage">
  <div id="phone">

    <!-- ══ L2 虚拟系统层：状态栏 ══ -->
    <div id="statusbar">
      <span id="sb-clock">--:--</span>
      <span id="sb-notch"></span>
      <span id="sb-right">
        <span id="sb-batt">100%</span>
        <span class="sb-batt-icon"><i id="sb-batt-fill"></i></span>
      </span>
    </div>

    <!-- ══ 桌面 ══ -->
    <div id="home">
      <div id="pages">
        <div class="page" data-page="0"></div>
        <div class="page" data-page="1"></div>
        <div class="page" data-page="2"></div>
      </div>
      <div id="dots"></div>
      <div id="dock"></div>
    </div>

    <!-- ══ L3 App 视图栈：app 全从这里挂载 ══ -->
    <div id="stack"></div>

    <!-- ══ 锁屏 ══ -->
    <div id="lock">
      <div id="lock-time">--:--</div>
      <div id="lock-date"></div>
      <div id="lock-widgets"></div>
      <div id="lock-hint">上滑解锁</div>
      <div id="lock-quick"></div>
      <div id="lock-pad" hidden></div>
    </div>

    <!-- ══ 底部小白条 ══ -->
    <div id="homebar"></div>

  </div>
</div>

<script src="js/core.js?v=ymusic8"></script>
<script src="js/apps.js?v=ymusic8"></script>
<script src="js/app.js?v=ymusic8"></script>
</body>
</html>
